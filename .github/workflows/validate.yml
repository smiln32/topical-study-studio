name: Validate Topical Study Studio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile generator
        run: python -m py_compile study_factory.py study_studio.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check CLI version and starter generation
        run: |
          python study_factory.py --version
          python study_factory.py --init /tmp/starter.json --topic "Psalm 23"
          python study_factory.py /tmp/starter.json /tmp/starter.html --validate-only

      - name: Validate example study
        run: python study_factory.py shared/examples/study/spec.json /tmp/study-output.html --validate-only

      - name: Validate study template
        run: python study_factory.py shared/study_spec_template.json /tmp/template-output.html --validate-only

      - name: Generate example study
        run: python study_factory.py shared/examples/study/spec.json /tmp/study-output.html

      - name: Verify generated page structure
        run: |
          grep -q 'width:816px;height:1056px' /tmp/study-output.html
          grep -q 'data-document-role="page"' /tmp/study-output.html
